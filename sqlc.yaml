# Configuración de sqlc. Un paquete generado POR bounded context
# (nunca uno global) para no romper INV-ID-20: ningún contexto lee
# la tabla de otro directamente. Ver docs/design/identidad-bounded-context.md
# sección 5, punto 4.
#
# Pendiente: agregar aquí cada entrada cuando el agente base-datos cree
# db/consultas/<contexto>.sql y las migraciones correspondientes.
version: "2"
sql:
  - engine: "postgresql"
    queries: "db/consultas/identidad.sql"
    schema: "db/migraciones"
    gen:
      go:
        package: "sqlc"
        out: "internal/identidad/adaptadores/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
  - engine: "postgresql"
    queries: "db/consultas/acceso.sql"
    schema: "db/migraciones"
    gen:
      go:
        package: "sqlc"
        out: "internal/acceso/adaptadores/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
  - engine: "postgresql"
    queries: "db/consultas/tenencia.sql"
    schema: "db/migraciones"
    gen:
      go:
        package: "sqlc"
        out: "internal/tenencia/adaptadores/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
  - engine: "postgresql"
    queries: "db/consultas/confianza.sql"
    schema: "db/migraciones"
    gen:
      go:
        package: "sqlc"
        out: "internal/confianza/adaptadores/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
